      /**
       * Calls the assisted prompt generation API using Gemini and MCP.
       *
       * @private
       * @returns {void}
       */
      btnGenerateWithGemini.addEventListener('click', function (e) {
        e.preventDefault();
        var intent = aiPromptIntent.value.trim();
        if (!intent) {
          _showToast(Homey.__("settings.custom_instructions.error_empty"), 'warning');
          aiPromptIntent.focus();
          return;
        }

        var btnText = btnGenerateWithGemini.querySelector('.btn-text');
        var spinner = btnGenerateWithGemini.querySelector('.loading-spinner');
        btnGenerateWithGemini.disabled = true;
        if (btnText) btnText.style.display = 'none';
        if (spinner) spinner.style.display = 'inline-block';

        Homey.api("POST", "/saved-prompts/generate", {
          text: intent,
          type: aiPromptType.value
        }, function (err, res) {
          btnGenerateWithGemini.disabled = false;
          if (btnText) btnText.style.display = 'inline';
          if (spinner) spinner.style.display = 'none';

          if (err) {
            console.error('[Settings:generatePrompt] Error from Gemini:', err);
            _showToast(Homey.__("prompt.error.generic", { error: err.message || err.toString() }), 'error');
            return;
          }

          if (res && res.success && res.generatedPrompt) {
            promptEditorContent.value = res.generatedPrompt;
            if (!promptEditorTitle.value.trim() && res.generatedTitle) {
              promptEditorTitle.value = res.generatedTitle;
            }
            if (!promptEditorDescription.value.trim() && res.generatedDescription) {
              promptEditorDescription.value = res.generatedDescription;
            }
            _showToast(Homey.__("settings.prompt_library.msg_generated"), 'success');
          } else {
            console.error('[Settings:generatePrompt] Generation failed:', res?.error);
            _showToast(res?.error || Homey.__("settings.common.unknown_error"), 'error');
          }
        });
      });

      /* ==========================================================================
       * Diagnostic Logs Management
       * ========================================================================== */
      const enableDebugLogging = document.getElementById('enableDebugLogging');
      const btnRefreshFileList = document.getElementById('btnRefreshFileList');
      const btnClearAllFiles = document.getElementById('btnClearAllFiles');
      const logsFileList = document.getElementById('logsFileList');

      // Load initial debug logging state from settings
      Homey.get('debug_logging_enabled', function (err, isEnabled) {
        if (err) return console.error('[Settings] Error loading debug_logging_enabled:', err);
        enableDebugLogging.checked = Boolean(isEnabled);
      });

      // Handle debug logging toggle change
      enableDebugLogging.addEventListener('change', function () {
        var isEnabled = enableDebugLogging.checked;
        Homey.set('debug_logging_enabled', isEnabled, function (err) {
          if (err) {
            enableDebugLogging.checked = !isEnabled;
            _showToast((Homey.__('settings.common.error_generic') || 'Error') + ': ' + (err.message || err), 'error');
            return;
          }
          _showToast(isEnabled ? Homey.__('settings.logs.toast_enabled') : Homey.__('settings.logs.toast_disabled'), 'success');
          _fetchLogFiles();
        });
      });

      /**
       * Safe confirm dialog using Homey.confirm with window.confirm fallback.
       *
       * @private
       * @param {string} message - Confirmation prompt text.
       * @param {function(Error|null, boolean): void} callback - Callback function with confirmed boolean.
       * @returns {void}
       */
      function _showConfirm(message, callback) {
        if (typeof Homey.confirm === 'function') {
          Homey.confirm(message, 'warning', callback);
        } else {
          var result = window.confirm(message);
          callback(null, result);
        }
      }

      /**
       * Fetches diagnostic log status and files from backend API and renders file list.
       *
       * @private
       * @param {function(): void} [callback] - Optional completion callback.
       * @returns {void}
       */
      function _fetchLogFiles(callback) {
        Homey.api('GET', '/log/status', null, function (err, status) {
          if (err) {
            console.error('[Settings:fetchLogFiles] Error getting log status:', err);
            logsFileList.innerHTML = '<div class="log-file-card" style="justify-content: center;"><span style="font-size: 13px; color: #e53e3e;">' + _escapeHtml(err.message || err.toString()) + '</span></div>';
            if (typeof callback === 'function') callback();
            return;
          }

          if (status && typeof status.debugEnabled === 'boolean') {
            enableDebugLogging.checked = status.debugEnabled;
          }

          _renderFileList(status && status.files ? status.files : []);
          if (typeof callback === 'function') callback();
        });
      }

      /**
       * Renders the diagnostic log file cards into the DOM.
       *
       * @private
       * @param {Array<object>} files - Array of log file descriptor objects.
       * @returns {void}
       */
      function _renderFileList(files) {
        logsFileList.innerHTML = '';
        if (!files || files.length === 0) {
          logsFileList.innerHTML = '<div class="log-file-card" style="justify-content: center;"><span style="font-size: 13px; color: var(--text-secondary);">' + Homey.__('settings.logs.no_files') + '</span></div>';
          return;
        }

        files.forEach(function (file) {
          var card = document.createElement('div');
          card.className = 'log-file-card';
          var formattedDate = new Date(file.modified).toLocaleString();

          card.innerHTML = 
            '<div class="log-file-info">' +
              '<div class="log-file-title">' + _escapeHtml(file.name) + (file.isCurrent ? ' <span style="font-size: 10px; font-weight: normal; color: #34c759; margin-left: 4px;">● ' + Homey.__('settings.logs.active_badge') + '</span>' : '') + '</div>' +
              '<div class="log-file-meta"><span>' + _escapeHtml(file.sizeFormatted) + '</span> &bull; <span>' + _escapeHtml(formattedDate) + '</span></div>' +
            '</div>' +
            '<div class="log-file-actions">' +
              '<button type="button" class="homey-button-secondary-shadow homey-button-small btn-download-file" data-index="' + file.index + '">' +
                Homey.__('settings.logs.btn_download') +
              '</button>' +
              '<button type="button" class="homey-button-danger-shadow homey-button-small btn-delete-file" data-index="' + file.index + '">' +
                Homey.__('settings.logs.btn_delete') +
              '</button>' +
            '</div>';

          var downloadBtn = card.querySelector('.btn-download-file');
          downloadBtn.addEventListener('click', function () {
            _downloadLogFile(file.index, downloadBtn);
          });

          var deleteBtn = card.querySelector('.btn-delete-file');
          deleteBtn.addEventListener('click', function () {
            _deleteSingleLogFile(file.index, file.name);
          });

          logsFileList.appendChild(card);
        });
      }

      /**
       * Requests a download URL from backend and triggers browser download.
       *
       * @private
       * @param {number} index - Rotation index of the log file.
       * @param {HTMLButtonElement} [buttonEl] - Download button element for state management.
       * @returns {void}
       */
      function _downloadLogFile(index, buttonEl) {
        if (buttonEl) buttonEl.disabled = true;
        Homey.api('GET', '/log/download/' + index, null, function (err, url) {
          if (buttonEl) buttonEl.disabled = false;
          if (err) {
            _showToast(Homey.__('settings.logs.download_error') + ': ' + (err.message || err.toString()), 'error');
            return;
          }

          if (url && typeof url === 'string') {
            try {
              if (typeof Homey.openURL === 'function') {
                Homey.openURL(url);
              }
            } catch (openErr) {
              console.warn('[downloadLogFile] Homey.openURL failed, using link fallback:', openErr);
            }
            var a = document.createElement('a');
            a.href = url;
            a.download = '';
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }
        });
      }

      /**
       * Confirms and deletes a single diagnostic log file.
       *
       * @private
       * @param {number} index - Rotation index of the log file.
       * @param {string} fileName - Filename for confirmation display.
       * @returns {void}
       */
      function _deleteSingleLogFile(index, fileName) {
        var confirmMsg = Homey.__('settings.logs.confirm_delete_file').replace('{0}', fileName);
        _showConfirm(confirmMsg, function (err, confirmed) {
          if (err || !confirmed) return;
          Homey.api('DELETE', '/log/' + index, null, function (deleteErr) {
            if (deleteErr) {
              _showToast(Homey.__('settings.common.error_generic') + ': ' + (deleteErr.message || deleteErr.toString()), 'error');
              return;
            }
            _showToast(Homey.__('settings.logs.msg_file_deleted'), 'success');
            _fetchLogFiles();
          });
        });
      }

      btnRefreshFileList.addEventListener('click', function () {
        btnRefreshFileList.disabled = true;
        _fetchLogFiles(function () {
          btnRefreshFileList.disabled = false;
          _showToast(Homey.__('settings.logs.refreshed'), 'success');
        });
      });

      btnClearAllFiles.addEventListener('click', function () {
        _showConfirm(Homey.__('settings.logs.confirm_clear_all'), function (err, confirmed) {
          if (err || !confirmed) return;
          Homey.api('DELETE', '/log/all', null, function (deleteErr) {
            if (deleteErr) {
              _showToast(Homey.__('settings.common.error_generic') + ': ' + (deleteErr.message || deleteErr.toString()), 'error');
              return;
            }
            _showToast(Homey.__('settings.logs.msg_cleared'), 'success');
            _fetchLogFiles();
          });
        });
      });

    }
  </script>
</body>

</html>
